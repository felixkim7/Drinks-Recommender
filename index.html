<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinks Recommender</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
    <div class="header">
        <div class="menu-icon">
            <!-- <i class="fa fa-bars"></i> -->
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </div>
        
        <a class="Title" href="index.html">Drinks Recommender</a>
        <a class="links1" href="index.html">Cocktails</a>
        <a class="links1" href="index.html">Whisky</a>

        <div class="header-searchbar">
            <input type="text" id="search-bar-header" placeholder="Search..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 8px;">
        </div>
        
    </div>

    <div class="navbar">

        <div class="filters con">
            <div class="select-btn filter-base-btn">
                <span class="btn-text" data-default-text="Base">Base</span>
                <span class="arrow-dwn">
                    <i class="fa-solid fa-chevron-down"></i>
                </span>
            </div>
            <ul class="list-items filter-base"></ul>
        </div>

        <div class="filters con">
            <div class="select-btn filter-ingredient-btn">
                <span class="btn-text" data-default-text="Ingredients">Ingredients</span>
                <span class="arrow-dwn">
                    <i class="fa-solid fa-chevron-down"></i>
                </span>
            </div>
            <ul class="list-items filter-ingredient"></ul>
        </div>
        
        <div class="filters con">
            <div class="select-btn filter-flavour-btn">
                <span class="btn-text" data-default-text="Flavours">Flavours</span>
                <span class="arrow-dwn">
                    <i class="fa-solid fa-chevron-down"></i>
                </span>
            </div>
            <ul class="list-items filter-flavour"></ul>
        </div>

        <div class="filters con">
            <div class="select-btn filter-strength-btn">
                <span class="btn-text" data-default-text="Strength">Strength</span>
                <span class="arrow-dwn">
                    <i class="fa-solid fa-chevron-down"></i>
                </span>
            </div>
            <ul class="list-items filter-strength"></ul>
        </div>

        <div class="filters con">
            <div class="searchbar">
                <input type="text" id="search-bar" placeholder="Search for a drink..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 8px;">
            </div>
        </div>

    </div>

    <div class="filter-status">
        <div class="filter-status-left">
            <p id="result-count" class="result-count"></p>
            <div id="selected-filter-chips" class="selected-filter-chips"></div>
        </div>

        <button id="clear-filters-btn" class="clear-filters-btn" type="button">
            Clear filters
        </button>
    </div>

    <div class="overlay"></div>

    <main>
        <div class="container" id="drinks-container"></div>
    </main>
    <script src="assets/js/data/drinks-data.js"></script>
    <script src="assets/js/pages/index.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</body>
</html>
